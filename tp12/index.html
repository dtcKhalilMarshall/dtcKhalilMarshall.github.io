<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App 2.0</title>
  <link rel="stylesheet" href="styles.css" media="all" />
  <script src="scripts.js" defer></script>
</head>
<body>
  <!-- modal overlay cover -->
  <div id="modalCover"></div>
  <!-- modal form for location input -->
  <div id="modalForm">
    <form id="locationForm">
      <label for="locationBox">Enter Location:</label>
      <input type="text" id="locationBox" required />
      <button type="submit">Get Weather</button>
    </form>
  </div>

  <!-- button to trigger location input modal -->
  <button id="findLocation">New Location</button>

  <main>
    <!-- current weather info -->
    <div id="currentInfo">
      <div id="currentTemp"><span></span>°F</div>
      <div id="currentStatus"></div>
    </div>

    <!-- current humidity -->
    <div id="currentHumidity"><span></span>%</div>

    <!-- current wind -->
    <div id="currentWind"></div>

    <!-- future forecast info -->
    <div id="futureInfo">
      <div class="futureDay">
        <div class="futureTemp"><span></span>°F</div>
        <div class="futureWind"></div>
        <div class="futureStatus"></div>
      </div>
      <div class="futureDay">
        <div class="futureTemp"><span></span>°F</div>
        <div class="futureWind"></div>
        <div class="futureStatus"></div>
      </div>
      <div class="futureDay">
        <div class="futureTemp"><span></span>°F</div>
        <div class="futureWind"></div>
        <div class="futureStatus"></div>
      </div>
    </div>
  </main>
</body>
</html>
