  <!-- Artist Cards Container -->
  <section class="artist-grid">

    <!-- Artist Card  for Steve Lacy -->
    <div class="artist-card">
      <div class="artist-info">
        <img 
          src="https://liftedasia.com/assets/content_images/steve-660x440.webp" 
          alt="Steve Lacy" 
          class="artist-image"/>
        <!-- Artist Name with icons -->
        <h3 class="artist-name">
          <a>Steve Lacy</a>
          <!-- Icons for Spotify and Apple Music -->
          <span class="music-icons">
            <a href="https://open.spotify.com/artist/57vWImR43h4CaDao012Ofp" target="_blank" rel="noopener noreferrer" title="Spotify">
              <img src="https://s3-alpha.figma.com/hub/file/2734964093/9f5edc36-eb4d-414a-8447-10514f2bc224-cover.png" class="icon-small" alt="Spotify" />
            </a>
            <a href="https://music.apple.com/us/artist/steve-lacy/1210275020" target="_blank" rel="noopener noreferrer" title="Apple Music">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS43LiJy3kibwItLhmtGCWzlK8qgmkw1TUHLQ&s" class="icon-small" alt="Apple Music" />
            </a>
          </span>
        </h3>
        <p>Steve Thomas Lacy-Moya is a Compton-born, Los Angeles-based, alternative R&B singer, guitarist, record producer, and Grammy winner.</p>
      </div>
    </div>

    <!-- Artist Card for Rihanna -->
    <div class="artist-card">
      <div class="artist-info">
        <img 
          src="https://media-cldnry.s-nbcnews.com/image/upload/t_fit-560w,f_auto,q_auto:best/newscms/2019_19/2853121/190510-rihanna-mn-0950.jpg" 
          alt="Rihanna" 
          class="artist-image"/>
        <!-- Artist Name with icons -->
        <h3 class="artist-name">
          <a>Rihanna</a>
          <span class="music-icons">
            <a href="https://open.spotify.com/artist/5pKCCKE2ajJHZ9KAiaK11H" target="_blank" rel="noopener noreferrer" title="Spotify">
              <img src="https://s3-alpha.figma.com/hub/file/2734964093/9f5edc36-eb4d-414a-8447-10514f2bc224-cover.png" class="icon-small" alt="Spotify" />
            </a>
            <a href="https://music.apple.com/us/artist/rihanna/63346553" target="_blank" rel="noopener noreferrer" title="Apple Music">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS43LiJy3kibwItLhmtGCWzlK8qgmkw1TUHLQ&s" class="icon-small" alt="Apple Music" />
            </a>
          </span>
        </h3>
      </div>
    </div>
